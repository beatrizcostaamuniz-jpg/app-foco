<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Pro</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .app {
      width: 320px;
      background: rgba(255,255,255,0.05);
      border-radius: 25px;
      padding: 25px;
      text-align: center;
      backdrop-filter: blur(15px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      margin-bottom: 15px;
      font-size: 22px;
      opacity: 0.9;
    }

    .timer {
      font-size: 70px;
      font-weight: bold;
      margin: 20px 0;
    }

    .progress-container {
      width: 100%;
      height: 8px;
      background: #334155;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      transition: width 1s linear;
    }

    .buttons {
      margin-top: 20px;
    }

    button {
      border: none;
      padding: 10px 18px;
      margin: 5px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    .start { background: #22c55e; }
    .pause { background: #facc15; color: black; }
    .reset { background: #ef4444; }

    button:hover {
      transform: scale(1.05);
    }

    .stats {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
    }

    .message {
      margin-top: 10px;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="app">
    <h1>🚀 Focus Pro</h1>

    <div class="timer" id="timer">25:00</div>

    <div class="progress-container">
      <div class="progress" id="progress"></div>
    </div>

    <div class="buttons">
      <button class="start" onclick="start()">Começar</button>
      <button class="pause" onclick="pause()">Pausar</button>
      <button class="reset" onclick="reset()">Resetar</button>
    </div>

    <div class="message" id="message"></div>

    <div class="stats">
      Sessões: <span id="sessions">0</span>
    </div>
  </div>

  <audio id="sound">
    <source src="https://www.soundjay.com/buttons/sounds/button-3.mp3">
  </audio>

  <script>
    let totalTime = 1500;
    let time = totalTime;
    let interval = null;

    let sessions = localStorage.getItem("sessions") || 0;
    document.getElementById("sessions").innerText = sessions;

    function updateUI() {
      let min = Math.floor(time / 60);
      let sec = time % 60;

      document.getElementById("timer").innerText =
        min + ":" + (sec < 10 ? "0" : "") + sec;

      let progress = ((totalTime - time) / totalTime) * 100;
      document.getElementById("progress").style.width = progress + "%";
    }

    function start() {
      if (interval) return;

      document.getElementById("message").innerText = "Foco ativo 🔥";

      interval = setInterval(() => {
        if (time > 0) {
          time--;
          updateUI();
        } else {
          clearInterval(interval);
          interval = null;

          document.getElementById("message").innerText = "Sessão concluída 🎉";
          document.getElementById("sound").play();

          sessions++;
          localStorage.setItem("sessions", sessions);
          document.getElementById("sessions").innerText = sessions;
        }
      }, 1000);
    }

    function pause() {
      clearInterval(interval);
      interval = null;
      document.getElementById("message").innerText = "Pausado ⏸️";
    }

    function reset() {
      time = totalTime;
      updateUI();
      pause();
      document.getElementById("message").innerText = "";
    }

    updateUI();
  </script>

</body>
</html>
