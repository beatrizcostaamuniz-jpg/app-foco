<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Control</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: radial-gradient(circle at center, #020617, #000);
  color: #e2e8f0;
  overflow:hidden;
}

/* FUNDO ESTRELAS */
canvas {
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

/* CONTAINER */
.container {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

/* CARD PRINCIPAL */
.panel {
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
  border:1px solid rgba(255,255,255,0.1);
  padding:30px;
  border-radius:25px;
  width:320px;
  text-align:center;
  box-shadow: 0 0 40px rgba(0,255,255,0.1);
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(20px);}
  to {opacity:1;}
}

/* TÍTULO */
h1 {
  letter-spacing:2px;
  margin-bottom:10px;
}

/* TIMER */
#tempo {
  font-size:70px;
  margin:20px 0;
  text-shadow:0 0 20px #0ea5e9;
}

/* BOTÕES */
button {
  margin:5px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:#0ea5e9;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

button:hover {
  box-shadow:0 0 15px #0ea5e9;
  transform:scale(1.05);
}

/* TEXTO */
.status {
  margin-top:10px;
  font-size:14px;
  opacity:0.8;
}

</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="container">
  <div class="panel">
    <h1>🚀 MISSION CONTROL</h1>
    <div id="tempo">25:00</div>

    <button onclick="start()">Iniciar</button>
    <button onclick="pause()">Pausar</button>
    <button onclick="reset()">Resetar</button>

    <div class="status" id="status">Sistema pronto</div>
  </div>
</div>

<script>
// TIMER
let time = 1500;
let interval;

function update(){
  let m=Math.floor(time/60);
  let s=time%60;
  document.getElementById("tempo").innerText =
    m+":"+(s<10?"0":"")+s;
}

function start(){
  if(interval) return;
  document.getElementById("status").innerText="Missão em andamento...";
  interval=setInterval(()=>{
    if(time>0){
      time--;
      update();
    } else {
      clearInterval(interval);
      interval=null;
      document.getElementById("status").innerText="Missão concluída 🚀";
    }
  },1000);
}

function pause(){
  clearInterval(interval);
  interval=null;
  document.getElementById("status").innerText="Pausado";
}

function reset(){
  time=1500;
  update();
  pause();
}

// ESTRELAS ANIMADAS
const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let stars=[];
for(let i=0;i<200;i++){
  stars.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*2,
    v:Math.random()*0.5
  });
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="white";

  stars.forEach(s=>{
    s.y+=s.v;
    if(s.y>canvas.height) s.y=0;

    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  });

  requestAnimationFrame(draw);
}

draw();
update();
</script>

</body>
</html>
