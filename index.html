<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Focus</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background: radial-gradient(circle at bottom, #020617, #000);
  color:white;
  overflow-x:hidden;
}

/* ESTRELAS */
canvas {
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

/* CONTAINER */
.container {
  text-align:center;
  padding:40px 20px;
}

/* TÍTULO */
h1 {
  font-size:32px;
  letter-spacing:2px;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.05);
  padding:20px;
  margin:20px auto;
  width:300px;
  border-radius:20px;
  backdrop-filter: blur(10px);
}

/* TIMER */
#tempo {
  font-size:60px;
  margin:20px;
}

/* BOTÕES */
button {
  padding:10px 20px;
  margin:5px;
  border:none;
  border-radius:10px;
  background:#0ea5e9;
  color:white;
  cursor:pointer;
}

button:hover {
  opacity:0.8;
}

/* INPUT */
input {
  padding:8px;
  border-radius:8px;
  border:none;
}

/* LISTA */
li {
  margin:5px;
  cursor:pointer;
}

.selected {
  color:#0ea5e9;
}

</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="container">

<h1>🚀 MISSION FOCUS</h1>

<div class="card">
<div id="tempo">25:00</div>

<button onclick="start()">Iniciar</button>
<button onclick="pause()">Pausar</button>
<button onclick="reset()">Resetar</button>

<p id="status"></p>
</div>

<div class="card">
<h3>📋 Missões</h3>
<input id="taskInput" placeholder="Nova missão">
<button onclick="addTask()">+</button>
<ul id="list"></ul>
<p>🎯 Atual: <span id="currentTask">Nenhuma</span></p>
</div>

</div>

<script>
// TIMER
let time=1500,interval,task="";
function update(){
 let m=Math.floor(time/60),s=time%60;
 document.getElementById("tempo").innerText=
 m+":"+(s<10?"0":"")+s;
}

function start(){
 if(interval)return;
 document.getElementById("status").innerText=
 "Missão ativa: "+(task||"Nenhuma");
 interval=setInterval(()=>{
  if(time>0){time--;update();}
  else{
   clearInterval(interval);
   interval=null;
   alert("Missão concluída 🚀");
   time=1500;
  }
 },1000);
}

function pause(){clearInterval(interval);interval=null;}
function reset(){time=1500;update();pause();}

// TAREFAS
function addTask(){
 let val=document.getElementById("taskInput").value;
 let li=document.createElement("li");
 li.textContent=val;

 li.onclick=()=>{
  task=val;
  document.getElementById("currentTask").innerText=val;
 };

 document.getElementById("list").appendChild(li);
}

// ESTRELAS
const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let stars=[];
for(let i=0;i<100;i++){
 stars.push({
  x:Math.random()*canvas.width,
  y:Math.random()*canvas.height,
  r:Math.random()*2
 });
}

function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle="white";

 stars.forEach(s=>{
  ctx.beginPath();
  ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
  ctx.fill();
 });
}

setInterval(draw,50);

update();
</script>

</body>
</html>
