<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Missão Foco PRO</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      text-align: center;
      padding-top: 50px;
    }

    h1 {
      font-size: 32px;
    }

    #tempo {
      font-size: 80px;
      margin: 20px 0;
      font-weight: bold;
    }

    .botoes button {
      padding: 12px 25px;
      margin: 5px;
      border: none;
      border-radius: 15px;
      font-size: 16px;
      cursor: pointer;
    }

    .start { background: #22c55e; }
    .pause { background: #facc15; color: black; }
    .reset { background: #ef4444; }

    .card {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      margin: 20px auto;
      width: 300px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    #progresso {
      width: 100%;
      height: 10px;
      background: #334155;
      border-radius: 10px;
      margin-top: 20px;
    }

    #barra {
      height: 10px;
      width: 0%;
      background: #22c55e;
      border-radius: 10px;
    }

    #mensagem {
      margin-top: 15px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>🚀 Missão Foco PRO</h1>

  <div class="card">
    <div id="tempo">25:00</div>

    <div id="progresso">
      <div id="barra"></div>
    </div>

    <div class="botoes">
      <button class="start" onclick="iniciar()">Começar</button>
      <button class="pause" onclick="pausar()">Pausar</button>
      <button class="reset" onclick="resetar()">Resetar</button>
    </div>

    <p id="mensagem"></p>
  </div>

  <div class="card">
    <h3>📊 Progresso</h3>
    <p>Sessões concluídas: <span id="sessoes">0</span></p>
  </div>

  <audio id="som">
    <source src="https://www.soundjay.com/buttons/sounds/button-3.mp3">
  </audio>

  <script>
    let tempo = 1500;
    let tempoTotal = 1500;
    let intervalo;

    let sessoes = localStorage.getItem("sessoes") || 0;
    document.getElementById("sessoes").innerText = sessoes;

    function atualizarTela() {
      let min = Math.floor(tempo / 60);
      let sec = tempo % 60;

      document.getElementById("tempo").innerText =
        min + ":" + (sec < 10 ? "0" : "") + sec;

      let progresso = ((tempoTotal - tempo) / tempoTotal) * 100;
      document.getElementById("barra").style.width = progresso + "%";
    }

    function iniciar() {
      if (intervalo) return;

      document.getElementById("mensagem").innerText = "Foco total 🔥";

      intervalo = setInterval(() => {
        if (tempo > 0) {
          tempo--;
          atualizarTela();
        } else {
          clearInterval(intervalo);
          intervalo = null;

          document.getElementById("mensagem").innerText = "Parabéns! 🎉";
          document.getElementById("som").play();

          sessoes++;
          localStorage.setItem("sessoes", sessoes);
          document.getElementById("sessoes").innerText = sessoes;
        }
      }, 1000);
    }

    function pausar() {
      clearInterval(intervalo);
      intervalo = null;
      document.getElementById("mensagem").innerText = "Pausado ⏸️";
    }

    function resetar() {
      tempo = tempoTotal;
      atualizarTela();
      pausar();
      document.getElementById("mensagem").innerText = "";
    }

    atualizarTela();
  </script>

</body>
</html>
