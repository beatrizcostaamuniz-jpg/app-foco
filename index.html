<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Control PRO</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#020617;
  color:white;
}

.container {
  max-width:400px;
  margin:auto;
  padding-bottom:80px;
}

.card {
  background:#1e293b;
  margin:10px;
  padding:15px;
  border-radius:15px;
}

/* TIMER */
#tempo {
  font-size:50px;
  text-align:center;
}

/* BOTÕES */
button {
  padding:8px;
  margin:5px;
  border:none;
  border-radius:8px;
}

.start{background:#22c55e;}
.pause{background:#facc15;}
.reset{background:#ef4444;}

/* MISSÕES */
.mission {
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  background:#334155;
}

.active { background:#0ea5e9; }
.done { background:#16a34a; }

/* NAV */
.nav {
  position:fixed;
  bottom:0;
  width:100%;
  max-width:400px;
  display:flex;
  background:#020617;
}

.nav button {
  flex:1;
  background:none;
  color:white;
}
</style>
</head>

<body>

<div class="container">

<!-- TIMER -->
<div id="home" class="card">
<h2>⏱️ Sistema de Foco</h2>
<div id="tempo">25:00</div>

<button class="start" onclick="start()">Start</button>
<button class="pause" onclick="pause()">Pause</button>
<button class="reset" onclick="reset()">Reset</button>

<p id="status"></p>
</div>

<!-- MISSÕES -->
<div id="missions" class="card" style="display:none">
<h2>🎯 Missões</h2>

<input id="missionInput" placeholder="Nova missão">
<button onclick="addMission()">Criar</button>

<div id="missionList"></div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="card" style="display:none">
<h2>📊 Dashboard</h2>
<p>Total de sessões: <span id="sessions">0</span></p>
<p>Missão ativa: <span id="currentMission">Nenhuma</span></p>
<p>Missões concluídas: <span id="doneCount">0</span></p>
</div>

</div>

<!-- NAV -->
<div class="nav">
<button onclick="show('home')">⏱️</button>
<button onclick="show('missions')">🎯</button>
<button onclick="show('dashboard')">📊</button>
</div>

<script>
// TIMER
let time=1500,interval;
let sessions=localStorage.getItem("sessions")||0;
let currentMission="";

document.getElementById("sessions").innerText=sessions;

function update(){
 let m=Math.floor(time/60),s=time%60;
 document.getElementById("tempo").innerText=
 m+":"+(s<10?"0":"")+s;
}

function start(){
 if(interval)return;

 document.getElementById("status").innerText=
 "Executando: "+(currentMission||"Nenhuma");

 interval=setInterval(()=>{
  if(time>0){time--;update();}
  else{
   clearInterval(interval);
   interval=null;

   sessions++;
   localStorage.setItem("sessions",sessions);
   document.getElementById("sessions").innerText=sessions;

   marcarConcluida();
   time=1500;
  }
 },1000);
}

function pause(){clearInterval(interval);interval=null;}
function reset(){time=1500;update();pause();}

// MISSÕES
let missions=JSON.parse(localStorage.getItem("missions")||"[]");

function renderMissions(){
 let container=document.getElementById("missionList");
 container.innerHTML="";

 let done=0;

 missions.forEach((m,i)=>{
  let div=document.createElement("div");
  div.className="mission "+m.status;
  div.innerText=m.nome;

  if(m.status==="done") done++;

  div.onclick=()=>{
    missions.forEach(x=>x.status="");
    m.status="active";
    currentMission=m.nome;
    document.getElementById("currentMission").innerText=m.nome;
    save();
    renderMissions();
  };

  container.appendChild(div);
 });

 document.getElementById("doneCount").innerText=done;
}

function addMission(){
 let val=document.getElementById("missionInput").value;

 missions.push({nome:val,status:""});
 save();
 renderMissions();
}

function marcarConcluida(){
 let m=missions.find(x=>x.status==="active");
 if(m){m.status="done";}
 save();
 renderMissions();
}

function save(){
 localStorage.setItem("missions",JSON.stringify(missions));
}

// NAV
function show(tab){
 ["home","missions","dashboard"].forEach(t=>{
  document.getElementById(t).style.display="none";
 });
 document.getElementById(tab).style.display="block";
}

// INIT
update();
renderMissions();
</script>

</body>
</html>
