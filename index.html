<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Master</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  margin: 0;
  padding: 20px;
}

h1 {
  text-align: center;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 20px;
}

button {
  padding: 8px 15px;
  margin: 5px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.start { background: #22c55e; }
.pause { background: #facc15; }
.reset { background: #ef4444; }

#tempo {
  font-size: 50px;
  text-align: center;
}

input {
  padding: 8px;
  border-radius: 8px;
  border: none;
  margin-right: 5px;
}

li {
  margin: 5px 0;
}

</style>
</head>

<body>

<h1>🚀 Focus Master</h1>

<div class="card">
  <h2>⏱️ Pomodoro</h2>
  <div id="tempo">25:00</div>
  <button class="start" onclick="start()">Começar</button>
  <button class="pause" onclick="pause()">Pausar</button>
  <button class="reset" onclick="reset()">Resetar</button>
  <p id="modo"></p>
</div>

<div class="card">
  <h2>📋 Tarefas</h2>
  <input id="tarefaInput" placeholder="Nova tarefa">
  <button onclick="addTask()">Adicionar</button>
  <ul id="lista"></ul>
</div>

<div class="card">
  <h2>🎯 Meta do dia</h2>
  <input id="metaInput" placeholder="Ex: estudar 2h">
  <button onclick="salvarMeta()">Salvar</button>
  <p id="meta"></p>
</div>

<div class="card">
  <h2>📊 Progresso</h2>
  <p>Sessões: <span id="sessoes">0</span></p>
</div>

<audio id="som">
  <source src="https://www.soundjay.com/buttons/sounds/button-3.mp3">
</audio>

<script>
let tempo = 1500;
let intervalo;
let modo = "foco";

let sessoes = localStorage.getItem("sessoes") || 0;
document.getElementById("sessoes").innerText = sessoes;

// TIMER
function atualizar() {
  let min = Math.floor(tempo/60);
  let sec = tempo%60;
  document.getElementById("tempo").innerText =
    min + ":" + (sec<10?"0":"")+sec;
}

function start(){
  if(intervalo) return;

  intervalo = setInterval(()=>{
    if(tempo>0){
      tempo--;
      atualizar();
    } else {
      clearInterval(intervalo);
      intervalo=null;
      document.getElementById("som").play();

      if(modo=="foco"){
        modo="pausa";
        tempo=300;
        sessoes++;
        localStorage.setItem("sessoes",sessoes);
      } else {
        modo="foco";
        tempo=1500;
      }

      document.getElementById("sessoes").innerText=sessoes;
      atualizar();
    }
  },1000);
}

function pause(){
  clearInterval(intervalo);
  intervalo=null;
}

function reset(){
  tempo=1500;
  modo="foco";
  atualizar();
  pause();
}

// TAREFAS
function addTask(){
  let input=document.getElementById("tarefaInput");
  let lista=document.getElementById("lista");

  let li=document.createElement("li");
  li.textContent=input.value;
  lista.appendChild(li);

  salvarTarefas();
  input.value="";
}

function salvarTarefas(){
  let tarefas=[];
  document.querySelectorAll("#lista li").forEach(li=>{
    tarefas.push(li.textContent);
  });
  localStorage.setItem("tarefas",JSON.stringify(tarefas));
}

function carregarTarefas(){
  let tarefas=JSON.parse(localStorage.getItem("tarefas")||"[]");
  tarefas.forEach(t=>{
    let li=document.createElement("li");
    li.textContent=t;
    document.getElementById("lista").appendChild(li);
  });
}

// META
function salvarMeta(){
  let valor=document.getElementById("metaInput").value;
  localStorage.setItem("meta",valor);
  document.getElementById("meta").innerText=valor;
}

function carregarMeta(){
  document.getElementById("meta").innerText=
    localStorage.getItem("meta")||"";
}

// INIT
atualizar();
carregarTarefas();
carregarMeta();
</script>

</body>
</html>
